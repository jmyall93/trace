<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TRACE | Facility Intelligence</title><link rel='stylesheet' href='styles.css'></head><body>
<div id="login" class="login-page"><section class="login-hero"><div class="brand hero-brand"><img src="trace-logo.svg" class="trace-logo login-logo" alt="TRACE"></div>
<div class="login-card"><div class="auth-tabs"><button class="auth-tab selected" data-mode="login">Sign in</button><button class="auth-tab" data-mode="trial">Start free trial</button></div><h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Access your facility intelligence workspace.</p>
<form id="authForm"><label class="auth-label">Company ID<input id="companyId" autocomplete="organization" required placeholder="e.g. ACME"></label><label class="auth-label">Username<input id="username" autocomplete="username" required placeholder="Username"></label><label class="auth-label" id="emailRow" hidden>Work email<input id="email" type="email" autocomplete="email" placeholder="name@company.com"></label><label class="auth-label" id="passwordRow">Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label><label class="auth-label" id="confirmRow" hidden>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password"></label><div class="login-meta" id="loginMeta"><label><input type="checkbox" id="rememberMe"> Remember me</label><button type="button" class="auth-link" id="forgotLink">Forgot password?</button></div><button id="submitAuth" type="submit">Sign in</button><p id="authError" role="alert" aria-live="polite" class="auth-error"></p></form>
<button type="button" id="backToLogin" class="auth-link auth-back" hidden>← Back to sign in</button><p class="auth-footnote" id="authFootnote">Don't have an account? Choose Start free trial.</p></div><footer>TRACE v2.1.0 · Cloudflare Edition<br><span>Every change leaves a trace.</span></footer></section></div>
<div id='app' class='app hidden'>
<aside><div class='brand'><img src='trace-logo.svg' class='trace-logo sidebar-logo' alt='TRACE'></div><nav id='nav'></nav><div class='systems'><h6>CONNECTED SYSTEMS</h6><div>● <b>Fiix</b><small>CMMS</small></div><div>● <b>FactoryTalk</b><small>ControlLogix</small></div><div>● <b>Honeywell</b><small>BMS</small></div></div><button class='settings'>⚙ Settings</button></aside>
<main><header><div class='search'>⌕ <input id='globalSearch' placeholder='Search assets, locations, events, work orders, or ask a question...'><span>✦</span></div><div class='profile'>🔔 &nbsp; <b>JD</b> &nbsp; John Doe⌄<br><small>⌂ Main Facility⌄</small></div></header><div id='view'></div></main>
</div><script src="app.js"></script><script src="edge-ui.js?v=2.2.5"></script><script src="auth.js"></script></body></html>
